name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Jolfa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./Jolfa-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Jolfa-Server

    # The backend suite runs against a real Postgres rather than a mocked
    # Prisma client, so the schema, transactions, and FK constraints under
    # test behave exactly as they do in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jolfa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jolfa_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-characters
      APP_URL: http://localhost:3001
      UPLOAD_DIR: uploads-test
      PUBLIC_UPLOAD_PATH: /uploads
      ZARINPAL_SANDBOX: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./Jolfa-Server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate

      # test/setup.ts loads .env.test and overrides process.env, so the file
      # must exist in CI. It is gitignored (it holds a local DB password), so
      # it is generated here from the job env above.
      - name: Write .env.test for the test run
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          HOST=0.0.0.0
          API_PREFIX=/api/v1
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/jolfa_test?schema=public
          JWT_SECRET=ci-test-secret-at-least-16-characters
          JWT_ACCESS_EXPIRES_IN=24h
          JWT_REFRESH_EXPIRES_IN=7d
          CORS_ORIGIN=*
          APP_URL=http://localhost:3001
          UPLOAD_DIR=uploads-test
          PUBLIC_UPLOAD_PATH=/uploads
          MAX_FILE_SIZE=5242880
          ZARINPAL_SANDBOX=true
          ADMIN_SEED_PASSWORD=admin123
          EOF

      - run: npm run typecheck:test
      - run: npm run test:run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Slower than the unit suites and boots both real servers, so it runs only
    # once they pass rather than in parallel with them.
    needs: [frontend, backend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # e2e/env.ts derives the jolfa_e2e URL from this; the database itself is
      # created by Jolfa-Server/test/e2e/prepare-database.ts.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: ./Jolfa-Server
        run: npm ci

      - name: Generate the Prisma client
        working-directory: ./Jolfa-Server
        run: npx prisma generate

      - name: Install web dependencies
        working-directory: ./Jolfa-web
        run: npm ci

      - name: Install e2e dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Type-check the e2e suite
        working-directory: ./e2e
        run: npm run typecheck

      # CI can reach the Playwright CDN, so it uses the bundled Chromium
      # rather than the system-Chrome channel local runs fall back to.
      - name: Install Playwright browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: ./e2e
        run: npm test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
