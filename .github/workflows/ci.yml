name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Jolfa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./Jolfa-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Jolfa-Server

    # The backend suite runs against a real Postgres rather than a mocked
    # Prisma client, so the schema, transactions, and FK constraints under
    # test behave exactly as they do in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jolfa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jolfa_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-16-characters
      APP_URL: http://localhost:3001
      UPLOAD_DIR: uploads-test
      PUBLIC_UPLOAD_PATH: /uploads
      ZARINPAL_SANDBOX: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./Jolfa-Server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate

      # test/setup.ts loads .env.test and overrides process.env, so the file
      # must exist in CI. It is gitignored (it holds a local DB password), so
      # it is generated here from the job env above.
      - name: Write .env.test for the test run
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3001
          HOST=0.0.0.0
          API_PREFIX=/api/v1
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/jolfa_test?schema=public
          JWT_SECRET=ci-test-secret-at-least-16-characters
          JWT_ACCESS_EXPIRES_IN=24h
          JWT_REFRESH_EXPIRES_IN=7d
          CORS_ORIGIN=*
          APP_URL=http://localhost:3001
          UPLOAD_DIR=uploads-test
          PUBLIC_UPLOAD_PATH=/uploads
          MAX_FILE_SIZE=5242880
          ZARINPAL_SANDBOX=true
          ADMIN_SEED_PASSWORD=admin123
          EOF

      - run: npm run typecheck:test
      - run: npm run test:run
      - run: npm run build
