# Copy to inventory.ini and fill in the real values.
# inventory.ini is gitignored so the customer's IP and SSH user never land in
# source control.
#
#   cp inventory.example.ini inventory.ini
#
# Every value below is a placeholder. Replace REPLACE_ME_* before running
# anything — the playbooks assert on them and will refuse to run otherwise.

[jolfa]
jolfa-prod ansible_host=REPLACE_ME_SERVER_IP ansible_user=root

[jolfa:vars]
# Public domain that resolves to ansible_host. Used for the Nginx server_name,
# the Let's Encrypt certificate, CORS_ORIGIN and the payment callback URLs.
domain_name=REPLACE_ME_DOMAIN            ; e.g. jolfa.example.ir
# Set to the www alias if you own it, otherwise leave empty.
domain_alias=
# Email Let's Encrypt uses for expiry warnings.
certbot_email=REPLACE_ME_EMAIL

# Optional: a non-root SSH user with sudo. If you connect as root, leave
# ansible_user=root above; provision.yml can create the deploy user for you.
# ansible_ssh_private_key_file=~/.ssh/jolfa_ed25519

# Semaphore UI can live on the same box (fine for one small customer) or on a
# separate control host. Point this group at whichever you chose.
[semaphore]
jolfa-prod ansible_host=REPLACE_ME_SERVER_IP ansible_user=root
