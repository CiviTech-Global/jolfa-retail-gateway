# Ansible configuration for Jolfa Retail Gateway.
#
# Run every playbook from this directory so these defaults apply:
#   cd ansible && ansible-playbook -i inventory.ini provision.yml
#
# Semaphore UI reads this file too — it sets ANSIBLE_CONFIG to the repository
# checkout, so keeping the settings here (rather than in a shell alias) means
# the CLI and the web UI behave identically.

[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
# Show which tasks actually changed something at the end of a long run.
callbacks_enabled    = ansible.posix.profile_tasks
interpreter_python   = auto_silent
# Deployment is a serial, ordered process; a wide fork count only makes the
# output harder to read on a single-host inventory.
forks                = 5

[ssh_connection]
# Reuses one SSH connection for the whole run. On a link to an Iranian VPS with
# 150ms+ RTT this is the difference between a 3-minute and a 12-minute deploy.
pipelining    = True
ssh_args      = -o ControlMaster=auto -o ControlPersist=15m -o ServerAliveInterval=30

[privilege_escalation]
become        = False
become_method = sudo
