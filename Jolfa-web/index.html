    <!--
      ENAMAD (اینماد) ownership verification.

      This lives in index.html rather than in the <Seo> component on purpose:
      ENAMAD's checker fetches the raw HTML and does not execute JavaScript, so
      a tag rendered by React would be invisible to it no matter how the page
      looks in a browser. Vite copies this file through the build untouched.

      Do not remove it after verification passes — ENAMAD re-checks
      periodically and the trust seal is withdrawn if the tag disappears.

      The same code is also proved by a companion file, public/71332061.txt,
      which must stay empty and reachable at https://araspro.ir/71332061.txt.
      It lives in public/ so the build copies it to the site root on every
      deploy; a file placed on the server by hand would be erased by the next
      release. Both methods are registered, so leave both in place.
    -->
    <meta name="enamad" content="71332061" />

    <!-- Dark theme temporarily disabled — no pre-hydration dark-class script for now. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
